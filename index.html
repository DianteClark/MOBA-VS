<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14121c">
<title>MOBA-VS — MOBA Manager</title>
<link rel="icon" href="assets/img/faces/kaze.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/img/app/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MOBA-VS">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="loading"><div class="ld"><div class="ldtitle">MOBA-VS</div><div class="barw"><i></i></div><div class="ldtip" id="ldtip">Painting the valley…</div></div></div>
<div id="fade"></div>
<div id="rotate"><div><div class="rot-icon"></div><b>Rotate your phone</b><small>MOBA-VS plays in landscape</small></div></div>
<canvas id="bg"></canvas>
<div id="screen"></div>
<div id="match" class="hidden">
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="leftcol" class="hud"><div id="myteam"></div></div>
    <div id="topcenter" class="hud"><div id="scorebar"></div><div id="objtimers"></div><div id="ticker" class="hidden"></div></div>
    <div id="rightcol" class="hud"><div id="enemyteam"></div><div id="killfeed"></div></div>
    <div id="banner" class="hud"></div>
    <div id="detail" class="hud hidden"></div>
    <div id="cmdbar" class="hud"></div>
    <div id="brcol" class="hud"><div id="ctrl"></div><canvas id="mm"></canvas></div>
    <div id="ring" class="hud hidden"></div>
    <div id="foestrip" class="hud"></div>
  </div>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
