<body>
<div id="loading"><div class="ld"><div class="ldtitle">MOBA-VS</div><div class="barw"><i></i></div><div class="ldtip" id="ldtip">Painting the valley…</div></div></div>
<div id="fade"></div>
<div id="rotate"><div><div class="rot-icon"></div><b>Rotate your phone</b><small>MOBA-VS plays in landscape</small></div></div>
<canvas id="bg"></canvas>
<div id="screen"></div>
<div id="match" class="hidden">
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="leftcol" class="hud"><div id="myteam"></div></div>
    <div id="topcenter" class="hud"><div id="scorebar"></div><div id="objtimers"></div><div id="ticker" class="hidden"></div></div>
    <div id="rightcol" class="hud"><div id="enemyteam"></div><div id="killfeed"></div></div>
    <div id="banner" class="hud"></div>
    <div id="detail" class="hud hidden"></div>
    <div id="cmdbar" class="hud"></div>
    <div id="brcol" class="hud"><div id="ctrl"></div><canvas id="mm"></canvas></div>
    <div id="ring" class="hud hidden"></div>
    <div id="foestrip" class="hud"></div>
  </div>
</div>
<script>
// Boot watchdog: remembers startup errors; if the game has not started 20s after the page loaded (for example a
// broken offline cache left by an older build), it clears this site's service worker and caches and reloads once.
// If it is still stuck after that, it shows the error and a "Reset game data" button instead of a frozen screen.
window.__bootErrs = [];
window.addEventListener('error', function (e) { window.__bootErrs.push((e.message || 'error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')); }, true);
window.addEventListener('unhandledrejection', function (e) { var r = e.reason; window.__bootErrs.push(String(r && (r.message || r) || 'rejected')); });
window.addEventListener('load', function () {
  setTimeout(function () {
    if (window.__mobavsBooted) return;
    var tip = document.getElementById('ldtip');
    var rescued = false; try { rescued = !!sessionStorage.getItem('mobavs_rescue'); } catch (e) { rescued = true; }
    function wipeCaches(alsoData) {
      var jobs = [];
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
      if (window.caches && caches.keys) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf('mobavs-') === 0; }).map(function (k) { return caches.delete(k); })); }));
      if (alsoData) { try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf('mobavs_') === 0 && k !== 'mobavs_settings' && k !== 'mobavs_lang') localStorage.removeItem(k); }); } catch (e) { /* ignore */ } }
      return Promise.all(jobs).catch(function () {});
    }
    if (!rescued && navigator.onLine) {
      try { sessionStorage.setItem('mobavs_rescue', '1'); } catch (e) { /* ignore */ }
      if (tip) tip.textContent = 'Refreshing the game files…';
      wipeCaches(false).then(function () { location.reload(); });
      return;
    }
    var ld = document.querySelector('#loading .ld'); if (!ld || document.getElementById('bootfail')) return;
    var box = document.createElement('div'); box.id = 'bootfail';
    box.style.cssText = 'margin-top:14px;font:12px/1.4 sans-serif;color:#ffd0c0;max-width:80vw;text-align:center';
    box.textContent = 'MOBA-VS could not start' + (window.__bootErrs.length ? ': ' + window.__bootErrs.slice(0, 2).join(' | ') : '.') + ' ';
    var btn = document.createElement('button'); btn.textContent = 'Reset game data and reload';
    btn.style.cssText = 'display:block;margin:10px auto 0;padding:8px 14px;font:600 13px sans-serif;border-radius:6px;border:0;background:#ffd84a;color:#000';
    btn.onclick = function () { btn.disabled = true; wipeCaches(true).then(function () { try { sessionStorage.clear(); } catch (e) { /* ignore */ } location.reload(); }); };
    box.appendChild(btn); ld.appendChild(box);
  }, 20000);
});
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
