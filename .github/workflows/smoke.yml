name: Live smoke test
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps webkit chromium
      - run: sleep 60 && node tools/live_smoke.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: smoke-shots, path: 'smoke-*.png' }
